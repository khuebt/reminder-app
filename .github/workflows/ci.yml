name: Validate and release
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - name: Install desktop test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y xserver-xorg-core xserver-xorg-video-dummy dbus-x11
      - run: npm ci
      - run: npx --no install-electron
      - run: npm run lint
      - run: npm test
      - run: npm run test:desktop
      - run: npm run dist
      - run: npm run test:desktop -- --packaged
      - name: Validate Debian package and produce checksums
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p 'require("./package.json").version')
          package="dist/daily-focus_${version}_amd64.deb"
          test "$(dpkg-deb -f "$package" Package)" = daily-focus
          test "$(dpkg-deb -f "$package" Version)" = "$version"
          test "$(dpkg-deb -f "$package" Architecture)" = amd64
          cd dist
          sha256sum "daily-focus_${version}_amd64.deb" > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Verify release metadata and generate notes
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            node scripts/release-notes.cjs "$REF_NAME" > dist/RELEASE_NOTES.md
          else
            node scripts/release-notes.cjs > dist/RELEASE_NOTES.md
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ubuntu-amd64-${{ github.sha }}
          if-no-files-found: error
          path: |
            dist/*.deb
            dist/SHA256SUMS
            dist/RELEASE_NOTES.md
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ubuntu-amd64-${{ github.sha }}
          path: dist
      - name: Verify artifacts and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c SHA256SUMS
          flags=()
          title="FocusFlow $TAG"
          if [[ "$TAG" == v0.* || "$TAG" == *-* ]]; then
            flags+=(--prerelease)
            title="$title (Preview)"
          fi
          gh release create "$TAG" --verify-tag "${flags[@]}" --title "$title" --notes-file RELEASE_NOTES.md ./*.deb SHA256SUMS
